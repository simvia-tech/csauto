name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest fastapi uvicorn pydantic httpx

      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Svelte check
        working-directory: frontend
        run: pnpm check

      - name: Prettier check
        working-directory: frontend
        run: pnpm format:check

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install dependencies
        run: npm ci

      - name: Package the linux-x64 .vsix (dashboard, wheel, extension, dependency wheels)
        run: |
          npm run package
          npm run bundle
          bash scripts/bundle-deps.sh linux-x64
          CSAUTO_SKIP_PREPUBLISH=1 npx --yes @vscode/vsce package --target linux-x64

      - name: Install csauto offline from the bundled wheels, as the extension does
        run: |
          python -m venv "$RUNNER_TEMP/offline"
          "$RUNNER_TEMP/offline/bin/pip" install --no-index --find-links bundled/wheels "$(ls bundled/csauto-*.whl)[web]"
          "$RUNNER_TEMP/offline/bin/python" -c "import csauto, fastapi, uvicorn"

      - name: Type-check the webviews (svelte-check from the frontend, installed by the packaging)
        run: npm run check:webview

      - name: Upload .vsix
        uses: actions/upload-artifact@v7
        with:
          name: csauto-vsix
          path: "*.vsix"
          if-no-files-found: error
