name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily run for the quality dashboard: new CVEs appear without any commit.
  schedule:
    - cron: "30 1 * * *"

jobs:
  lint:
    # Not part of the quality reports.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Scheduled runs only need the Python version the quality reports come from.
        python-version: ${{ fromJSON(github.event_name == 'schedule' && '["3.13"]' || '["3.11", "3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest pytest-cov fastapi uvicorn pydantic httpx

      - name: Run tests
        run: >
          pytest -q --cov=csauto --cov-report=xml:reports/coverage-python.xml
          --junitxml=reports/junit-python.xml

      # One Python version is enough for the quality dashboard.
      - if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: reports-python
          path: reports/

  frontend:
    # Not part of the quality reports.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Svelte check
        working-directory: frontend
        run: pnpm check

      - name: Prettier check
        working-directory: frontend
        run: pnpm format:check

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  site:
    # Not part of the quality reports.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Build the landing page
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build

      - name: Build the docs
        working-directory: docs-site
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  extension:
    # Not part of the quality reports.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install dependencies
        run: npm ci

      - name: Package the linux-x64 .vsix (dashboard, wheel, extension, dependency wheels)
        run: |
          npm run package
          npm run bundle
          bash scripts/bundle-deps.sh linux-x64
          CSAUTO_SKIP_PREPUBLISH=1 npx --yes @vscode/vsce package --target linux-x64

      - name: Install csauto offline from the bundled wheels, as the extension does
        run: |
          python -m venv "$RUNNER_TEMP/offline"
          "$RUNNER_TEMP/offline/bin/pip" install --no-index --find-links bundled/wheels "$(ls bundled/csauto-*.whl)[web]"
          "$RUNNER_TEMP/offline/bin/python" -c "import csauto, fastapi, uvicorn"

      - name: Type-check the webviews (svelte-check from the frontend, installed by the packaging)
        run: npm run check:webview

      - name: Upload .vsix
        uses: actions/upload-artifact@v7
        with:
          name: csauto-vsix
          path: "*.vsix"
          if-no-files-found: error

  # Reports read by the quality dashboard (quality.simvia.internal), from the template of
  # simvia/common-tools/quality (templates/github-actions.yml).
  quality-reports:
    needs: [test]
    if: always() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      PYTHON_PATHS: "csauto"
      JSCPD_PATHS: "csauto src frontend/src webviews"
      TS_PATHS: "src frontend/src webviews"
      DOCS_SITE_DIR: "docs-site/dist"
      DOCS_BUILD: "cd docs-site && pnpm install --frozen-lockfile && pnpm build"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/download-artifact@v7
        continue-on-error: true  # no test job uploaded reports
        with:
          pattern: reports-*
          path: reports/
          merge-multiple: true
      - name: Collect quality reports
        shell: bash
        run: |
          # Each block is one && chain: a failing tool only leaves its metric at n/a.
          mkdir -p reports
          fetch() { curl -sSfL --retry 3 --retry-all-errors "$@"; }
          # Scanners exit 1 (osv-scanner) or 2 (lychee) when they find something: still a valid report.
          found_ok() { s=$?; [ $s -eq 0 ] || [ $s -eq "$1" ]; }

          echo "== Vulnerable dependencies (osv-scanner, every lockfile)"
          fetch -o /tmp/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 &&
            chmod +x /tmp/osv-scanner &&
            { /tmp/osv-scanner scan source -r --format sarif --output-file reports/vulns-osv.sarif . > /dev/null; found_ok 1; } ||
            echo "skipped"

          echo "== Duplication (jscpd)"
          npx -y jscpd@4 $JSCPD_PATHS --gitignore --reporters json --output reports --silent || echo "skipped"

          if [ -n "$PYTHON_PATHS" ]; then
            echo "== Python lint (ruff) and documented share (interrogate)"
            fetch https://astral.sh/uv/0.9.5/install.sh | sh > /dev/null &&
              export PATH="$HOME/.local/bin:$PATH" &&
              uvx ruff@0.15.6 check $PYTHON_PATHS --exit-zero --output-format sarif -o reports/lint-python.sarif &&
              uv run -q --no-project --with interrogate==1.7.0 python - $PYTHON_PATHS <<'EOF' || echo "skipped"
          import json, sys
          from interrogate import config, coverage
          conf = config.InterrogateConfig(ignore_private=True, ignore_semiprivate=True, ignore_magic=True, ignore_nested_functions=True)
          r = coverage.InterrogateCoverage(paths=sys.argv[1:], conf=conf).get_coverage()
          json.dump({"total": r.total, "missing": r.missing}, open("reports/docs-python.json", "w"))
          EOF
          fi

          if [ -n "$TS_PATHS" ]; then
            echo "== TypeScript documented share (exported items with a JSDoc comment)"
            npm install --silent --no-audit --no-fund --prefix /tmp/tsdocs typescript@5.9.3 > /dev/null &&
              cat > /tmp/ts-docs.cjs <<'TSDOCS' &&
          const ts = require('typescript')
          const fs = require('fs')
          const path = require('path')

          // Type declarations, tests, build output and generated code are not API to document.
          const SKIP =
            /(^|\/)(node_modules|dist|build|out|coverage|\.next|\.svelte-kit|migrations|tests?|__tests__)(\/|$)|\.(d|test|spec)\.tsx?$|(^|\/)payload-types\.ts$/

          function files(p) {
            if (SKIP.test(p)) return []
            const stat = fs.statSync(p, { throwIfNoEntry: false })
            if (!stat) return []
            if (stat.isDirectory()) return fs.readdirSync(p).flatMap((f) => files(path.join(p, f)))
            return /\.tsx?$/.test(p) ? [p] : []
          }

          const exported = (n) => ts.getModifiers(n)?.some((m) => m.kind === ts.SyntaxKind.ExportKeyword)
          const functionLike = (n) =>
            n && (ts.isArrowFunction(n) || ts.isFunctionExpression(n) || ts.isClassExpression(n))
          const documented = (n) =>
            ts.getJSDocCommentsAndTags(n).some((d) => ts.isJSDoc(d) && (d.comment?.length || d.tags?.length))

          let total = 0
          let missing = 0
          for (const file of process.argv.slice(2).flatMap(files)) {
            const kind = file.endsWith('x') ? ts.ScriptKind.TSX : ts.ScriptKind.TS
            const source = ts.createSourceFile(file, fs.readFileSync(file, 'utf8'), ts.ScriptTarget.Latest, true, kind)
            for (const node of source.statements) {
              if (!exported(node)) continue
              let items = 0
              if (ts.isFunctionDeclaration(node)) items = node.body ? 1 : 0 // overload signatures are not counted
              else if (ts.isClassDeclaration(node) || ts.isInterfaceDeclaration(node)) items = 1
              else if (ts.isTypeAliasDeclaration(node) || ts.isEnumDeclaration(node)) items = 1
              else if (ts.isVariableStatement(node))
                items = node.declarationList.declarations.filter((d) => functionLike(d.initializer)).length
              total += items
              if (!documented(node)) missing += items
            }
          }
          if (total) {
            fs.mkdirSync('reports', { recursive: true })
            fs.writeFileSync('reports/docs-ts.json', JSON.stringify({ total, missing }))
          }
          console.log(`${total - missing} of ${total} exported items documented`)
          TSDOCS
              NODE_PATH=/tmp/tsdocs/node_modules node /tmp/ts-docs.cjs $TS_PATHS ||
              echo "skipped"
          fi

          if [ -n "$DOCS_SITE_DIR" ]; then
            echo "== Broken links of the docs website (lychee)"
            { [ -z "$DOCS_BUILD" ] || sh -c "$DOCS_BUILD"; } &&
              fetch https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp &&
              { /tmp/lychee-x86_64-unknown-linux-musl/lychee --no-progress --exclude-all-private --root-dir "$PWD/$DOCS_SITE_DIR" --fallback-extensions html \
                  --format json --output reports/links-docs.json "$DOCS_SITE_DIR/**/*.html"; found_ok 2; } ||
              echo "skipped"
          fi
          ls -l reports
      - uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: reports/

  # Analysis on the internal SonarQube (sonar.simvia.internal), reached through a NetBird tunnel.
  # Skipped until the secrets SONAR_TOKEN and NETBIRD_SETUP_KEY and the variable SONAR_HOST_URL exist.
  sonar:
    needs: [quality-reports]
    if: always() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      SONAR_ENABLED: ${{ secrets.SONAR_TOKEN != '' && secrets.NETBIRD_SETUP_KEY != '' && vars.SONAR_HOST_URL != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # blame data and new code detection
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: "*reports*"
          path: reports/
          merge-multiple: true
      - name: Join the NetBird network
        if: env.SONAR_ENABLED == 'true'
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          curl -sSfL https://pkgs.netbird.io/install.sh | sh
          sudo netbird up --setup-key "$NETBIRD_SETUP_KEY" --hostname "gh-csauto-$GITHUB_RUN_ID"
          host=$(echo "$SONAR_HOST_URL" | sed -E 's|^[a-z]+://||; s|[:/].*||')  # without scheme, port or path
          for _ in $(seq 30); do getent hosts "$host" && break; sleep 2; done
          getent hosts "$host"
          # Private CA of the internal services, for the Java scanner.
          keytool -importcert -noprompt -alias simvia -file ci/simvia-ca.crt \
            -keystore "$RUNNER_TEMP/simvia.jks" -storepass changeit
          echo "SONAR_SCANNER_OPTS=-Djavax.net.ssl.trustStore=$RUNNER_TEMP/simvia.jks -Djavax.net.ssl.trustStorePassword=changeit" >> "$GITHUB_ENV"
      - uses: SonarSource/sonarqube-scan-action@v8
        if: env.SONAR_ENABLED == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
