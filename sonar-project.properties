sonar.projectKey=csauto
sonar.projectName=csauto

sonar.sources=csauto,src,frontend/src,webviews
sonar.tests=tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.svelte-kit/**

# Coverage and lint findings produced by the CI, see .github/workflows/pr.yml
sonar.python.coverage.reportPaths=reports/coverage-python.xml
sonar.sarifReportPaths=reports/lint-python.sarif
