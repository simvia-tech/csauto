[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csauto"
dynamic = ["version"]
description = "Automate code_saturne CFD simulation campaigns"
requires-python = ">=3.11"
license = "GPL-3.0-only"

[project.scripts]
csauto = "csauto.cli:main"

[project.optional-dependencies]
web = ["fastapi>=0.100", "uvicorn>=0.20", "pydantic>=2.0"]
dev = ["pytest", "httpx", "ruff"]
doe = ["scipy>=1.10"]

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["csauto"]
# The built dashboard is ignored by git but shipped in the wheel (cd frontend && pnpm build first).
artifacts = ["csauto/_frontend/"]

# Each solver's example, which the extension's New Campaign copies. Listed part by part so a
# local RUNS/ left over from trying an example never lands in the wheel.
[tool.hatch.build.targets.wheel.force-include]
"examples/codeaster-cube/MESH" = "csauto/_examples/codeaster-cube/MESH"
"examples/codeaster-cube/README.md" = "csauto/_examples/codeaster-cube/README.md"
"examples/codeaster-cube/TEMPLATE" = "csauto/_examples/codeaster-cube/TEMPLATE"
"examples/codeaster-cube/csauto.toml" = "csauto/_examples/codeaster-cube/csauto.toml"
"examples/codeaster-cube/doe.csv" = "csauto/_examples/codeaster-cube/doe.csv"
"examples/single-case/MESH" = "csauto/_examples/single-case/MESH"
"examples/single-case/POST/.gitkeep" = "csauto/_examples/single-case/POST/.gitkeep"
"examples/single-case/README.md" = "csauto/_examples/single-case/README.md"
"examples/single-case/TEMPLATE" = "csauto/_examples/single-case/TEMPLATE"
"examples/single-case/csauto.toml" = "csauto/_examples/single-case/csauto.toml"
"examples/single-case/doe.csv" = "csauto/_examples/single-case/doe.csv"

[tool.hatch.build.targets.sdist]
exclude = ["frontend/node_modules", "tests", "examples", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
# ruff 0.16 formats python code fences in markdown; keep prose docs out of scope
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "SIM108", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"csauto/fastapi_routes/*" = ["B008"]
"tests/*" = ["E731"]

[tool.ruff.format]
quote-style = "double"
