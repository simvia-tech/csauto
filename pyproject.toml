[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csauto"
dynamic = ["version"]
description = "Automate code_saturne CFD simulation campaigns"
requires-python = ">=3.11"
license = "GPL-3.0-only"

[project.scripts]
csauto = "csauto.cli:main"

[project.optional-dependencies]
web = ["fastapi>=0.100", "uvicorn>=0.20", "pydantic>=2.0"]
dev = ["pytest", "httpx", "ruff"]
doe = ["scipy>=1.10"]

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["csauto"]

[tool.hatch.build.targets.sdist]
exclude = ["frontend/node_modules", "tests", "examples", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
# ruff 0.16 formats python code fences in markdown; keep prose docs out of scope
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "SIM108", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"csauto/fastapi_routes/*" = ["B008"]
"tests/*" = ["E731"]

[tool.ruff.format]
quote-style = "double"
